[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-partitioning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2.0",
    "qiskit-ibm-runtime",
    "qiskit-aer",
    "networkx",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
